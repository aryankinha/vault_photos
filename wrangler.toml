name = "vaultphotos-proxy"
main = "worker/index.js"
compatibility_date = "2026-06-22"

[observability]
enabled = true
head_sampling_rate = 1

# Existing secrets: HF_TOKEN, HF_REPO.
# Owner authentication stores only the SHA-256 verifier of a random 256-bit
# code in AUTH_TOKEN_SHA256. Never put the code in source or VITE_* variables.
[vars]
AUTH_MODE = "token"
ALLOWED_ORIGIN = "https://vaultphotos.vercel.app"

# Optional alternative: AUTH_MODE="access" with ACCESS_TEAM_DOMAIN / ACCESS_AUD.
# Local .dev.vars may use ENVIRONMENT=development, with literal HTTP loopback
# URLs only. Production has no unauthenticated bypass.
